user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    #tcp_nopush     on;

    keepalive_timeout 65;

    #gzip  on;

#     server {
#         listen 80;
#         server_name weilai.team www.weilai.team;
#
#         root /usr/share/nginx/html;
#         index index.html;
#
#         location / {
#             try_files $uri $uri/ /index.html;
#         }
#
#         error_page 500 502 503 504 /50x.html;
#         location = /50x.html {
#             root /usr/share/nginx/html;
#         }
#     }

    # 1. 所有 HTTP 请求强制跳转至 HTTPS
    server {
        listen 80;
        server_name weilai.team www.weilai.team;
        return 301 https://$host$request_uri;  # 自动跳转到对应域名的 HTTPS 版本
    }

    # 2. 处理 weilai.team 的 HTTPS 请求（使用其专属证书）
    server {
        listen 443 ssl;
        server_name weilai.team;

        # 引用 weilai.team 的单域名证书
        ssl_certificate /etc/nginx/ssl/weilai_team/weilai.team.pem;
        ssl_certificate_key /etc/nginx/ssl/weilai_team/weilai.team.key;

        # SSL 安全配置（通用）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        # 非 www 跳转至 www（保持域名统一）
        return 301 https://www.weilai.team$request_uri;
    }

    # 3. 处理 www.weilai.team 的 HTTPS 请求（使用其专属证书）
    server {
        listen 443 ssl;
        server_name www.weilai.team;

        # 引用 www.weilai.team 的单域名证书
        ssl_certificate /etc/nginx/ssl/www_weilai_team/www.weilai.team.pem;
        ssl_certificate_key /etc/nginx/ssl/www_weilai_team/www.weilai.team.key;

        # SSL 安全配置（通用）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers on;

        # 前端静态文件配置
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;  # 支持单页应用路由
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}